name: "Bug report"
description: "Behavior contradicts the docs or the expected loop rules."
labels: ["bug"]
body:
  - type: input
    id: reference
    attributes: { label: "Related issue/PR", description: "Reference, or a short ID if none." }
  - type: textarea
    id: environment
    attributes: { label: "Environment", description: "OS, Python version, agent harness, where the skill is deployed." }
    validations: { required: true }
  - type: textarea
    id: reproduction
    attributes: { label: "Reproduction steps", description: "Headless first; screenshots/video if visual." }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: "Expected result", description: "What the loop should do." }
    validations: { required: true }
  - type: textarea
    id: actual
    attributes: { label: "Actual result", description: "What happened, with the ledger if the loop ran." }
    validations: { required: true }
  - type: textarea
    id: workaround
    attributes: { label: "Workarounds" }
  - type: textarea
    id: recommendation
    attributes: { label: "Recommendation", description: "If a fix path exists, name it." }
