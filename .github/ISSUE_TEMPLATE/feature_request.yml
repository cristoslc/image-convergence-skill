name: "Feature request"
description: "Enhancement of the loop, the skill prose, or the tooling."
labels: ["enhancement"]
body:
  - type: input
    id: reference
    attributes: { label: "Related issue/PR" }
  - type: textarea
    id: environment
    attributes: { label: "Environment", description: "Where the need surfaced." }
  - type: textarea
    id: problem
    attributes: { label: "Problem", description: "The gap, stated problem-first." }
    validations: { required: true }
  - type: textarea
    id: goal
    attributes: { label: "Goal", description: "The outcome." }
    validations: { required: true }
  - type: textarea
    id: acceptance
    attributes: { label: "Acceptance sketch" }
    validations: { required: true }
  - type: textarea
    id: alternatives
    attributes: { label: "Alternatives and workarounds" }
  - type: textarea
    id: recommendation
    attributes: { label: "Recommendation" }
